  }
  #title .eyebrow{ font-family:'VT323', monospace; font-size:1.7rem; color:var(--gold); text-shadow:0 2px 6px rgba(0,0,0,0.7); }
  #title h1{
    font-family:'Press Start 2P', monospace; font-weight:400;
    font-size:clamp(1.1rem, 3.6vw, 2rem); line-height:1.5; margin:8px 0 16px;
    text-shadow:0 4px 18px rgba(0,0,0,0.75);
  }
  #title .prompt{
    font-family:'Silkscreen'; font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--paper); opacity:0.85;
    padding:10px 22px; border:1px solid rgba(244,236,216,0.5); border-radius:2px;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:0.55;} 50%{opacity:1;} }

  /* ---------- OVERWORLD ---------- */
  #world-wrap{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 30% 20%, #2e2740 0%, transparent 55%),
      var(--cork);
  }
  #hud{
    position:absolute; top:16px; left:0; right:0; text-align:center; z-index:5; pointer-events:none;
  }
  #hud .eyebrow{ font-family:'VT323', monospace; color:var(--gold); font-size:1.4rem; }
  #hud h1{ font-family:'Press Start 2P', monospace; font-weight:400; font-size:0.95rem; margin:6px 0; }
  #hud .hint{ font-family:'Silkscreen'; font-size:0.6rem; color:#b9aed0; }

  #map{
    position:relative;
    width:920px; height:560px; max-width:96vw; max-height:78vh;
    background-image:

    background-size:60px 60px, 60px 60px, cover;
    background-position:center;
    background-repeat:no-repeat;
    image-rendering:pixelated;
    overflow:hidden;
    border:6px solid var(--ink);
  }

  .marker{
    position:absolute;
    width:64px; text-align:center;
    transform:translate(-50%, -100%);
  }
  .marker .thumb{
    width:56px; height:56px; margin:0 auto;
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:1.5rem;
    border:4px solid var(--ink);
    overflow:hidden;
  }
  .marker .thumb img{ width:100%; height:100%; object-fit:cover; image-rendering:pixelated; }
  .marker .label{
    font-family:'VT323', monospace; font-weight:700; font-size:1.25rem; line-height:1;
    color:var(--paper); margin-top:4px; text-shadow:0 2px 4px rgba(0,0,0,0.8);
  }
  .marker.locked .thumb{ filter:grayscale(0.5) brightness(0.7); }
  /* a solved pin gets a little gold check badge */
  .marker.visited .thumb{ border-color:var(--gold); }
  .marker.visited .thumb::after{ content:'✓'; position:absolute; right:-6px; top:-6px;
    width:18px; height:18px; line-height:18px; text-align:center; font-size:0.7rem;
    font-family:'Silkscreen'; color:var(--ink); background:var(--gold); border:2px solid var(--ink); }
  .marker .thumb{ position:relative; }
  .marker .prompt-bubble{
    position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:var(--ink); font-family:'Silkscreen'; font-weight:600;
    font-size:0.65rem; padding:3px 8px; border-radius:10px; white-space:nowrap;
    opacity:0; transition:opacity 0.15s ease; pointer-events:none;
  }
  .marker.near .prompt-bubble{ opacity:1; }

  /* jasmine NPC: a standing character sprite instead of a thumbnail pin */
  .marker.npc{ width:72px; }
  .marker.npc .npc-sprite{
    width:72px; height:72px; image-rendering:pixelated; display:block; margin:0 auto;
  }
  .marker.npc.near .npc-sprite{ transform:translateY(-2px); }

  /* jasmine dialogue portrait */
  .dialogue-portrait{ text-align:center; margin:0 auto 10px; }
  .dialogue-portrait img{
    width:120px; height:120px; image-rendering:pixelated;
    border:4px solid var(--ink); background:var(--paper);
  }

  #player{
    position:absolute;
    width:60px; height:60px;
    transform:translate(-50%, -85%);
    z-index:4;
    image-rendering:pixelated;
  }
  #player img{ width:100%; height:100%; image-rendering:pixelated; display:block; }
  #player.face-left #player-sprite{ transform:scaleX(-1); }

  /* ---------- SCENE MODAL (flat pixel-art) ---------- */
  #scene{
    position:fixed; inset:0; background:rgba(10,8,16,0.8);
    display:none; align-items:center; justify-content:center; z-index:30; padding:20px;
  }
  #scene.open{display:flex;}
  .card{
    background:var(--paper); color:var(--ink);
    width:min(560px, 100%); padding:26px;
    border:6px solid var(--ink); position:relative;
    image-rendering:pixelated;
  }
  .card h2{ font-family:'Press Start 2P', monospace; font-weight:400; margin:0 0 10px; font-size:1rem; line-height:1.4; color:var(--teal); }
  .card .tagline{ font-family:'VT323', monospace; font-size:1.4rem; color:var(--rose); margin-bottom:18px; }
  .close{ position:absolute; top:8px; right:10px; background:none; border:none; font-family:'Press Start 2P', monospace; font-size:0.8rem; color:var(--ink); cursor:pointer; }
  .close:hover{ color:var(--rose); }

  #grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:10px 0 18px; }
  .tile{
    aspect-ratio:1/1; background:var(--teal);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:1.6rem; color:transparent; border:5px solid var(--ink);
  }
  .tile.flipped{ background:var(--paper); color:var(--ink); }
  .tile.matched{ background:var(--gold); color:var(--ink); cursor:default; }
  #progress{ font-family:'Silkscreen'; font-size:0.7rem; color:#6a5f4a; margin-bottom:6px; }
  #win{ display:none; text-align:center; font-family:'VT323', monospace; font-size:1.6rem; color:var(--rose); margin-top:8px; }
  #win.show{ display:block; }
  .placeholder-note{
    font-family:'Silkscreen'; font-size:0.6rem; color:#5c5240; line-height:1.7;
    background:#ece1c8; border:4px dashed var(--gold); padding:12px 14px; margin-top:6px;
  }

  /* ---------- costume picker (halloween) ---------- */
  .mirror{
    width:168px; height:168px; margin:6px auto 12px;
    background:var(--teal); position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    border:6px solid var(--ink); image-rendering:pixelated;
  }
  .mirror img{ width:132px; height:132px; image-rendering:pixelated; }
  .mirror .costume{ position:absolute; bottom:14px; font-size:3.4rem; }
  .reaction{ text-align:center; font-family:'VT323', monospace; font-size:1.6rem; color:var(--teal); min-height:1.6em; margin-bottom:12px; }
  .pick-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:14px; }
  .pick{
    width:54px; height:54px; border:5px solid var(--ink);
    background:var(--paper); font-size:1.6rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .pick.active{ border-color:var(--rose); background:var(--gold); }

  /* ---------- dialogue (ihop) ---------- */
  .dialogue{
    background:#ece1c8; border:5px solid var(--ink); padding:16px 18px;
    font-family:'VT323', monospace; font-size:1.55rem; line-height:1.35; color:var(--ink);
    min-height:88px; margin-bottom:14px;
  }
  .choices{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .choice{
    font-family:'Silkscreen'; font-size:0.75rem; text-align:left;
    background:var(--teal); color:var(--paper); border:5px solid var(--ink);
    padding:11px 14px; cursor:pointer;
  }
  .choice:hover{ background:var(--rose); }

  /* ---------- shore (puerto rico) ---------- */
  .shore{
    position:relative; height:200px; overflow:hidden; margin-bottom:12px;
    border:6px solid var(--ink); image-rendering:pixelated;
    background:
      linear-gradient(var(--pink) 0 8px, transparent 8px),
      linear-gradient(#7ec4c9 0%, #4f8483 44%, #e0c98f 44%, #d3a45c 100%);
    background-repeat:no-repeat;
  }
  .spot{
    position:absolute; font-size:1.5rem; cursor:pointer; background:none; border:none;
    padding:2px;
  }
  .spot.found{ opacity:0.3; cursor:default; }
  .reveal{
    font-family:'VT323', monospace; font-size:1.6rem; color:var(--rose);
    text-align:center; min-height:1.6em; margin-bottom:8px;
  }

  /* ---------- makeup (drawing) ---------- */
  .makeup-stage{
    position:relative; width:240px; height:300px; margin:0 auto 12px;   /* 48x60 -> 4:5, matches hello kitty */
    border:6px solid var(--ink); background:var(--paper); image-rendering:pixelated;
  }
  .makeup-stage canvas{ position:absolute; left:0; top:0; width:240px; height:300px; image-rendering:pixelated; }
  #makeup-face{ position:absolute; left:0; top:0; width:240px; height:300px; z-index:1; pointer-events:none; image-rendering:pixelated; }   /* optional template overlay */
  #makeup-paint{ z-index:0; cursor:crosshair; touch-action:none; }
  .tool-row{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:8px; }
  .tool{
    width:44px; height:44px; border:4px solid var(--ink); background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .tool.active{ background:var(--gold); border-color:var(--rose); }
  .swatch-row{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-bottom:8px; max-width:320px; margin-left:auto; margin-right:auto; }
  .swatch{ width:22px; height:22px; border:3px solid var(--ink); cursor:pointer; padding:0; }
  .swatch.active{ border-color:var(--paper); outline:3px solid var(--ink); }
  .size-row{ display:flex; gap:6px; justify-content:center; align-items:center; margin-bottom:10px; }
  .size-dot{
    border:4px solid var(--ink); background:var(--paper); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .size-dot.active{ background:var(--gold); border-color:var(--rose); }
  .size-dot span{ background:var(--ink); border-radius:50%; display:block; }

  /* ---------- puzzle (puerto rico sliding tiles) ---------- */
  .puzzle{
    position:relative; width:300px; height:300px; margin:0 auto 12px;
    border:6px solid var(--ink); background:var(--ink); image-rendering:pixelated;
  }
  .ptile{
    position:absolute; background-image:var(--puz-img); background-repeat:no-repeat;
    image-rendering:pixelated; cursor:pointer; border:1px solid var(--ink);
    box-sizing:border-box;
  }
  .ptile.blank{ background:var(--ink-soft); cursor:default; }

  /* ---------- bookstore: color-sort puzzle (books on shelves) ---------- */
  .sort-wrap{ display:flex; gap:12px; justify-content:center; align-items:flex-end;
    margin:0 auto 12px; padding:14px 10px; border:6px solid var(--ink);
    background:var(--cork); width:max-content; max-width:100%; }
  .shelf{ position:relative; width:64px; padding:6px 5px 8px; cursor:pointer;
    background:var(--ink-soft); border:4px solid var(--ink); box-sizing:border-box;
    display:flex; flex-direction:column-reverse; align-items:center; gap:4px;
    min-height:140px; }             /* fits 4 books + padding */
  .shelf .base{ position:absolute; left:-4px; right:-4px; bottom:-4px; height:6px; background:var(--ink); }
  .shelf.selected{ border-color:var(--gold); }
  .shelf.nope{ animation:shelf-bounce 0.22s ease; }
  /* a book lying on a shelf: wide, short, blocky. solid colored spine, a DARKER
     same-hue outline + one binding band near the edge. no pages. */
  .sbook{ width:48px; height:22px; border:3px solid; box-sizing:border-box;
    border-radius:0; position:relative; image-rendering:pixelated; overflow:hidden; }
  .sbook::after{ content:''; position:absolute; top:0; bottom:0; left:6px; width:3px;
    background:currentColor; }   /* one binding band, tinted to the darker outline color */
  .sbook.lift{ transform:translateY(-10px); }
  .sbook.settle{ animation:book-settle 0.28s cubic-bezier(.34,1.56,.64,1); }
  @keyframes book-settle{ 0%{ transform:translateY(-14px); } 60%{ transform:translateY(3px); } 100%{ transform:translateY(0); } }
  @keyframes shelf-bounce{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  .sort-status{ text-align:center; font-family:'VT323', monospace; font-size:1.35rem;
    color:var(--paper); margin-bottom:8px; }
  #sort-win{ display:none; text-align:center; font-family:'VT323', monospace;
    font-size:1.5rem; color:var(--rose); margin-top:4px; }
  #sort-win.show{ display:block; }

  @media (prefers-reduced-motion: reduce){
    #title .prompt{ animation:none; }
    .sbook.settle, .shelf.nope{ animation:none; }
  }
</style>
</head>
<body>

<div id="title" onclick="startWorld()">
  <div class="eyebrow">happy girlfriend day</div>
  <h1>a little map of us</h1>
  <div class="prompt">click anywhere to start</div>
</div>

<div id="world-wrap" style="display:none;">
  <div id="hud">
    <div class="eyebrow">happy girlfriend day</div>
    <h1>a little map of us</h1>
    <div class="hint">walk with arrow keys / WASD &nbsp;·&nbsp; press Enter near a pin</div>
  </div>

  <div id="map">
    <!-- markers -->
    <div class="marker" id="m-memory" style="left:150px; top:120px;">
      <div class="prompt-bubble">Enter ↵</div>
      <div class="thumb"><img src="" data-hib="red" alt=""></div>
      <div class="label">memory</div>
    </div>
    <div class="marker" id="m-bookstore" style="left:300px; top:390px;">
      <div class="prompt-bubble">Enter ↵</div>
      <div class="thumb"><img src="" data-hib="orange" alt=""></div>
      <div class="label">bookstore</div>
    </div>
    <div class="marker" id="m-makeup" style="left:560px; top:130px;">
      <div class="prompt-bubble">Enter ↵</div>
      <div class="thumb"><img src="" data-hib="purple" alt=""></div>
      <div class="label">paint &amp; sip</div>
    </div>
    <div class="marker" id="m-pr" style="left:720px; top:390px;">
      <div class="prompt-bubble">Enter ↵</div>
      <div class="thumb"><img src="" data-hib="blue" alt=""></div>
      <div class="label">puerto rico</div>
    </div>

    <!-- jasmine: an NPC you walk up to for the first-date dialogue -->
    <div class="marker npc" id="m-jasmine" style="left:460px; top:300px;">
      <div class="prompt-bubble">talk ↵</div>
      <img class="npc-sprite" id="jasmine-sprite" src="" alt="">
      <div class="label">jasmine</div>
    </div>

    <div id="player"><img id="player-sprite" src="" alt=""></div>
  </div>
</div>

<div id="scene">
  <div class="card">
    <button class="close" onclick="closeScene()">✕</button>
    <div id="scene-body"></div>
  </div>
</div>

  /* pixelarticons (MIT), monochrome so we tint them from the Resurrect 64 palette.
     icon(name, color, px) -> an inline SVG string colored via `fill`. */
  function icon(name, color, px){
    px = px || 40; color = color || 'currentColor';
    var svg = PIXICONS[name] || PIXICONS['star'];
    return svg
      .replace('<svg ', '<svg style="width:'+px+'px;height:'+px+'px;color:'+color+';display:block;image-rendering:pixelated" ')
      .replace(/fill="currentColor"/, 'fill="'+color+'"');
  }


  const sprite = document.getElementById('player-sprite');
  let facing = 'down';   // 'up' | 'down' | 'side'
  let stepToggle = false;

  // walk cycles alternate a walk frame with the standing frame as the in-between:
  //   up   -> walk-up  <-> stand-back
  //   down -> walk-down<-> stand-front
  //   side -> sideA    <-> sideB
  function drawFrame(moving){
    let src;
    if(facing === 'up')        src = moving ? (stepToggle ? SPRITES.up   : STAND_BACK)  : STAND_BACK;
    else if(facing === 'down') src = moving ? (stepToggle ? SPRITES.down : STAND_FRONT) : STAND_FRONT;
    else                       src = moving ? (stepToggle ? SPRITES.sideB : SPRITES.sideA) : SPRITES.sideA;
    sprite.src = src;
  }
  drawFrame(false);

  /* ---------- movement ---------- */
  const player = document.getElementById('player');
  const map = document.getElementById('map');
  let px = 460, py = 460;
  let walkToggle = false;
  let walkTimer = null;
  const keys = {};
  const speed = 4;

  function clampToMap(){
    const w = map.clientWidth, h = map.clientHeight;
    px = Math.max(20, Math.min(w-20, px));
    py = Math.max(30, Math.min(h-20, py));
  }

  function updatePlayerPos(){
    player.style.left = px + 'px';
    player.style.top = py + 'px';
  }
  clampToMap();
  updatePlayerPos();

  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if(e.key === 'Enter'){ tryEnterNearMarker(); }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function gameLoop(){
    let moving = false;
    let dx = 0, dy = 0;
    if(keys['arrowup'] || keys['w']) dy -= speed;
    if(keys['arrowdown'] || keys['s']) dy += speed;
    if(keys['arrowleft'] || keys['a']) dx -= speed;
    if(keys['arrowright'] || keys['d']) dx += speed;

    // vertical takes priority for facing, else side-facing
    if(dy < 0){ facing = 'up'; }
    else if(dy > 0){ facing = 'down'; }
    else if(dx !== 0){
      facing = 'side';
      player.classList.toggle('face-left', dx < 0);
    }

    if(dx !== 0 || dy !== 0){
      moving = true;
      px += dx; py += dy;
      clampToMap();
      updatePlayerPos();
    }

    // one shared walk-cycle timer: every direction alternates its walk frame
    // with the standing frame as the in-between, so up/down animate too.
    if(moving && !walkTimer){
      walkTimer = setInterval(() => {
        stepToggle = !stepToggle;
        drawFrame(true);
      }, 160);
    } else if(!moving && walkTimer){
      clearInterval(walkTimer);
      walkTimer = null;
      stepToggle = false;
    }

    drawFrame(moving);

    updateNearMarkers();
    requestAnimationFrame(gameLoop);
  }
  requestAnimationFrame(gameLoop);

  /* ---------- markers / proximity ---------- */
  const markers = Array.from(document.querySelectorAll('.marker'));
  let nearestMarker = null;

  function updateNearMarkers(){
    nearestMarker = null;
    let bestDist = 70;
    markers.forEach(m => {
      const mx = parseFloat(m.style.left);
      const my = parseFloat(m.style.top);
      const d = Math.hypot(px - mx, py - my);
      if(d < bestDist){ bestDist = d; nearestMarker = m; }
      m.classList.remove('near');
    });
    if(nearestMarker) nearestMarker.classList.add('near');
  }

  function tryEnterNearMarker(){
    if(!nearestMarker) return;
    switch(nearestMarker.id){
      case 'm-memory':    openMemoryGame(); break;
      case 'm-makeup':    openMakeupGame(); break;
      case 'm-jasmine':   openJasmineDialogue(); break;
      case 'm-bookstore': openBookStackGame(); break;
      case 'm-pr':        openPuertoRicoGame(); break;
      default:
        openPlaceholder(nearestMarker.querySelector('.label').textContent);
    }
  }

  /* ---------- scene modal ---------- */
  function closeScene(){ document.getElementById('scene').classList.remove('open'); }

  function openPlaceholder(label){
    document.getElementById('scene-body').innerHTML = `
      <h2>${label}</h2>
      <div class="tagline">this stop isn't built yet</div>
      <div class="placeholder-note">Once we lock the mechanic for "${label}," this is where it'll live — same walk-up-and-press-Enter flow as the memory game.</div>
    `;
    document.getElementById('scene').classList.add('open');
  }

  /* ---------- memory: matching game (colored pixel icons) ---------- */
  function openMemoryGame(){
    document.getElementById('scene-body').innerHTML = `
      <h2>memory</h2>
      <div class="tagline">find every pair</div>
      <div id="progress">0 of 8 pairs found</div>
      <div id="grid"></div>
      <div id="win">that's every one of them &#129293; — swap these icons for real photo pairs and it's ready</div>
      <div class="placeholder-note">Prototype note: swap these icons for two crops of the same photo per pair.</div>
    `;
    document.getElementById('scene').classList.add('open');

    // each pair = an icon tinted with a distinct Resurrect 64 color
    const faces = [
      { i:'heart',  c:'#f04f78' }, { i:'star',   c:'#f9c22b' },
      { i:'moon',   c:'#8fd3ff' }, { i:'music',  c:'#a884f3' },
      { i:'camera', c:'#30e1b9' }, { i:'coffee', c:'#cd683d' },
      { i:'cake',   c:'#ed8099' }, { i:'gift',   c:'#1ebc73' }
    ];
    const deck = [...faces, ...faces]
      .map(f => ({ f, k: f.i, r: Math.random() }))
      .sort((a, b) => a.r - b.r);
    const grid = document.getElementById('grid');
    let flipped = [], matchedCount = 0, lock = false;

    deck.forEach(card => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.symbol = card.k;
      tile.addEventListener('click', () => {
        if(lock || tile.classList.contains('flipped') || tile.classList.contains('matched')) return;
        tile.classList.add('flipped'); tile.innerHTML = icon(card.f.i, card.f.c, 46);
        flipped.push(tile);
        if(flipped.length === 2){
          lock = true;
          const [a,b] = flipped;
          if(a.dataset.symbol === b.dataset.symbol){
            setTimeout(() => {
              a.classList.add('matched'); b.classList.add('matched');
              matchedCount++;
              document.getElementById('progress').textContent = matchedCount + ' of 8 pairs found';
              if(matchedCount === 8) document.getElementById('win').classList.add('show');
              flipped = []; lock = false;
            }, 350);
          } else {
            setTimeout(() => {
              a.classList.remove('flipped'); a.innerHTML='';
              b.classList.remove('flipped'); b.innerHTML='';
              flipped = []; lock = false;
            }, 650);
          }
        }
      });
      grid.appendChild(tile);
    });
  }

  /* ---------- makeup: draw on a face (the paint & sip birthday) ---------- */
  function openMakeupGame(){
    document.getElementById('scene-body').innerHTML = `
      <h2>paint &amp; sip</h2>
      <div class="tagline">the paint &amp; sip you took me to — paint anything</div>
      <div class="makeup-stage">
        <canvas id="makeup-paint" width="240" height="300"></canvas>
        <img id="makeup-face" width="240" height="300" alt="">
      </div>
      <div class="tool-row" id="makeup-tools"></div>
      <div class="size-row" id="makeup-sizes"></div>
      <div class="swatch-row" id="makeup-swatches"></div>
      <div class="placeholder-note">Prototype note: paint freely on the blank canvas, or tap the template button to drop the hello kitty outline on top and color it in. Swap the template PNG for any transparent outline you like.</div>
    `;
    document.getElementById('scene').classList.add('open');

    const RESURRECT = [
      '#2e222f','#3e3546','#625565','#966c6c','#ab947a','#694f62','#7f708a','#9babb2','#c7dcd0','#ffffff',
      '#6e2727','#b33831','#ea4f36','#f57d4a','#ae2334','#e83b3b','#fb6b1d','#f79617','#f9c22b',
      '#7a3045','#9e4539','#cd683d','#e6904e','#fbb954','#4c3e24','#676633','#a2a947','#d5e04b','#fbff86',
      '#165a4c','#239063','#1ebc73','#91db69','#cddf6c','#313638','#374e4a','#547e64','#92a984','#b2ba90',
      '#0b5e65','#0b8a8f','#0eaf9b','#30e1b9','#8ff8e2','#323353','#484a77','#4d65b4','#4d9be6','#8fd3ff',
      '#45293f','#6b3e75','#905ea9','#a884f3','#eaaded','#753c54','#a24b6f','#cf657f','#ed8099',
      '#831c5d','#c32454','#f04f78','#f68181','#fca790','#fdcbb0'
    ];

    // ---- optional template overlay (hello kitty) on the TOP layer, off by default ----
    // it's a transparent-interior PNG that fills the whole square, so paint on the
    // canvas underneath shows through everywhere except the outline.
    const face = document.getElementById('makeup-face');
    face.src = HELLOKITTY;
    let templateOn = true;   // hello kitty shown by default; toggle off for a blank canvas

    // ---- paint layer (BOTTOM canvas): PIXEL GRID, not free-form ----
    // 48x48 cells over the 288px canvas => 6px cells, matching the hello kitty
    // pixel art. Painting snaps to whole cells; brush size = how many cells wide.
    const paint = document.getElementById('makeup-paint');
    const px = paint.getContext('2d');
    const CELL = 5;                 // px per grid cell (240/48 = 300/60 = 5)
    const COLS = paint.width  / CELL;   // 48
    const ROWS = paint.height / CELL;   // 60

    let color = '#cf657f';   // start on a lipstick rose
    let size = 2;            // brush size in CELLS (not px)
    let tool = 'brush';      // 'brush' | 'eraser' | 'fill'
    let drawing = false;

    function cellAt(e){
      const r = paint.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
      const gx = Math.floor((cx * (paint.width  / r.width))  / CELL);
      const gy = Math.floor((cy * (paint.height / r.height)) / CELL);
      return { gx, gy };
    }
    // paint a size x size block of whole cells centred on the cell under the cursor
    function paintCell(gx, gy){
      const half = Math.floor(size / 2);
      const x0 = (gx - half) * CELL, y0 = (gy - half) * CELL, w = size * CELL;
      if(tool === 'eraser'){ px.clearRect(x0, y0, w, w); return; }
      px.fillStyle = color; px.fillRect(x0, y0, w, w);
    }
    function apply(e){
      const { gx, gy } = cellAt(e);
      if(gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;
      paintCell(gx, gy);
    }
    function start(e){
      e.preventDefault();
      if(tool === 'fill'){ px.fillStyle = color; px.fillRect(0,0,paint.width,paint.height); return; }
      drawing = true; apply(e);
    }
    function move(e){ if(!drawing) return; e.preventDefault(); apply(e); }
    function stop(){ drawing = false; }
    paint.addEventListener('mousedown', start); paint.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);
    paint.addEventListener('touchstart', start, {passive:false});
    paint.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', stop);

    // ---- tools ----
    const tools = [
      { id:'brush',  ic:'brush',  c:'#4d9be6' },
      { id:'fill',   ic:'fill',   c:'#f79617' },
      { id:'eraser', ic:'eraser', c:'#966c6c' }
    ];
    const toolRow = document.getElementById('makeup-tools');
    function setTool(id){
      tool = id;
      toolRow.querySelectorAll('.tool').forEach(x => x.classList.toggle('active', x.dataset.tool === id));
    }
    tools.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tool' + (t.id === tool ? ' active' : ''); b.title = t.id; b.dataset.tool = t.id;
      b.innerHTML = icon(t.ic, t.c, 26);
      b.addEventListener('click', () => setTool(t.id));
      toolRow.appendChild(b);
    });
    const clr = document.createElement('button');
    clr.className = 'tool'; clr.title = 'clear'; clr.dataset.tool = 'clear';
    clr.innerHTML = icon('trash', '#b33831', 26);
    clr.addEventListener('click', () => px.clearRect(0,0,paint.width,paint.height));
    toolRow.appendChild(clr);

    // optional hello kitty template toggle
    const tpl = document.createElement('button');
    tpl.className = 'tool active'; tpl.title = 'hello kitty template'; tpl.dataset.tool = 'template';
    tpl.innerHTML = icon('bookmark', '#f04f78', 26);
    tpl.addEventListener('click', () => {
      templateOn = !templateOn;
      face.style.display = templateOn ? 'block' : 'none';
      tpl.classList.toggle('active', templateOn);
    });
    toolRow.appendChild(tpl);

    // ---- brush sizes ----
    const sizes = [1, 2, 3, 5];   // in grid cells
    const sizeRow = document.getElementById('makeup-sizes');
    sizes.forEach(s => {
      const b = document.createElement('button');
      b.className = 'size-dot' + (s === size ? ' active' : '');
      b.style.width = '40px'; b.style.height = '40px';
      const d = document.createElement('span');
      const dia = Math.max(5, Math.min(26, s * CELL));
      d.style.width = dia + 'px'; d.style.height = dia + 'px';
      d.style.borderRadius = '0';   // square = pixel block
      b.appendChild(d);
      b.addEventListener('click', () => {
        size = s;
        sizeRow.querySelectorAll('.size-dot').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      });
      sizeRow.appendChild(b);
    });

    // ---- color swatches (full Resurrect 64 palette) ----
    const swatchRow = document.getElementById('makeup-swatches');
    RESURRECT.forEach(hex => {
      const b = document.createElement('button');
      b.className = 'swatch' + (hex === color ? ' active' : '');
      b.style.background = hex; b.title = hex;
      b.addEventListener('click', () => {
        color = hex;
        if(tool === 'eraser' || tool === 'fill') setTool('brush');
        swatchRow.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      });
      swatchRow.appendChild(b);
    });
  }

  /* ---------- iHOP: first-date dialogue / choice scene ---------- */
  /* ---------- jasmine NPC: first-date dialogue (she blushes on the sweet lines) ---------- */
  function openJasmineDialogue(){
    const scene = {
      start: {
        text: 'first date. iHOP, way too late at night. the waiter\'s waiting. what do you order?',
        blush: false,
        choices: [
          { label: 'the pancakes', ic:'cake',   c:'#f9c22b', to: 'pancakes' },
          { label: 'just a coffee, playing it cool', ic:'coffee', c:'#cd683d', to: 'coffee' },
          { label: '"whatever you\'re having"', ic:'heart', c:'#f04f78', to: 'same' }
        ]
      },
      pancakes: { text: 'you ordered the pancakes. of course you did. i knew right then.', blush:true, end:true },
      coffee:   { text: 'coffee at midnight, so we\'d have an excuse to stay longer. smooth.', blush:true, end:true },
      same:     { text: '"whatever you\'re having." we ended up sharing everything. still do.', blush:true, end:true }
    };
    const sceneEl = document.getElementById('scene');
    sceneEl.classList.add('open');

    // blush -> blush+heart interpolation on the sweet lines
    let blushTimer = null;
    function stopBlush(){ if(blushTimer){ clearInterval(blushTimer); blushTimer = null; } }
    // stop the loop if the scene is closed
    const obs = new MutationObserver(() => { if(!sceneEl.classList.contains('open')){ stopBlush(); obs.disconnect(); } });
    obs.observe(sceneEl, { attributes:true, attributeFilter:['class'] });

    function render(key){
      const node = scene[key];
      stopBlush();
      const portrait = node.blush ? JASMINE_BLUSH : JASMINE;
      document.getElementById('scene-body').innerHTML = `
        <h2>first date</h2>
        <div class="tagline">iHOP, the night it started</div>
        <div class="dialogue-portrait"><img id="jasmine-portrait" src="${portrait}" alt="jasmine"></div>
        <div class="dialogue">${node.text}</div>
        <div class="choices" id="ihop-choices"></div>
        ${node.end ? '<div class="placeholder-note">Prototype note: swap in real lines and a photo from that night. Add more branches as you remember them.</div>' : ''}
      `;
      const box = document.getElementById('ihop-choices');
      if(node.blush){
        const portraitEl = document.getElementById('jasmine-portrait');
        let heart = false;
        blushTimer = setInterval(() => {
          heart = !heart;
          portraitEl.src = heart ? JASMINE_BLUSH_HEART : JASMINE_BLUSH;
        }, 550);
      }
      if(node.end){
        const again = document.createElement('button');
        again.className = 'choice';
        again.style.display = 'flex'; again.style.alignItems = 'center'; again.style.gap = '8px';
        again.innerHTML = icon('reload', '#8fd3ff', 20) + '<span>order something else</span>';
        again.addEventListener('click', () => render('start'));
        box.appendChild(again);
      } else {
        node.choices.forEach(ch => {
          const b = document.createElement('button');
          b.className = 'choice';
          b.style.display = 'flex'; b.style.alignItems = 'center'; b.style.gap = '10px';
          b.innerHTML = icon(ch.ic, ch.c, 22) + '<span>' + ch.label + '</span>';
          b.addEventListener('click', () => render(ch.to));
          box.appendChild(b);
        });
      }
    }
    render('start');
  }

  /* ---------- bookstore: color-sort puzzle (Ball Sort, skinned as books) ---------- */
  function openBookStackGame(){
    document.getElementById('scene-body').innerHTML = `
      <h2>bookstore</h2>
      <div class="tagline">that little bookshop — sort the shelves by color</div>
      <div class="sort-status" id="sort-status">tap a shelf, then tap where the book goes</div>
      <div class="sort-wrap" id="sort-wrap"></div>
      <div id="sort-win">every shelf its own color &#129293; — tidy, just how you like it</div>
      <div class="placeholder-note">Prototype note: colored blocks stand in for real book spines. A shelf only accepts a book that matches its top color (or an empty shelf) — no wrong move ever breaks it, disallowed taps just bounce. Swap blocks for drawn spines later without touching the logic.</div>
    `;
    document.getElementById('scene').classList.add('open');

    const SLOTS = 4;                 // books per shelf
    // 4 clearly-distinct hues from Resurrect 64, each paired with a DARKER same-hue
    // shade (also from the palette) used for its outline + binding band.
    const COLORS = [
      { c:'#f9c22b', d:'#4c3e24' },  // gold  -> dark olive-brown  (all d: from Resurrect 64)
      { c:'#e83b3b', d:'#ae2334' },  // coral -> dark red
      { c:'#0eaf9b', d:'#0b5e65' },  // teal  -> deep teal
      { c:'#a884f3', d:'#6b3e75' }   // purple-> deep violet
    ];

    // 4 filled shelves + 2 empty buffers = calm & easy, solvable in well under a minute
    // build a solved layout then shuffle with valid-ish scattering so it's always solvable.
    function buildShelves(){
      // start solved: one color per filled shelf
      const filled = COLORS.map(c => Array.from({length: SLOTS}, () => c));
      // pool every book, then deal back out randomly across the filled shelves
      const pool = [];
      filled.forEach(s => { while(s.length) pool.push(s.pop()); });
      // Fisher–Yates
      for(let i = pool.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const shelves = COLORS.map(() => []);
      let k = 0;
      for(let s = 0; s < COLORS.length; s++){
        for(let n = 0; n < SLOTS; n++){ shelves[s].push(pool[k++]); }
      }
      shelves.push([]);              // buffer 1
      shelves.push([]);              // buffer 2
      return shelves;
    }

    function isSolved(shelves){
      return shelves.every(s => s.length === 0 || (s.length === SLOTS && s.every(c => c === s[0])));
    }
    // avoid handing her an already-solved (or trivially-solved) board
    let shelves = buildShelves();
    let guard = 0;
    while(isSolved(shelves) && guard++ < 20){ shelves = buildShelves(); }

    const wrap = document.getElementById('sort-wrap');
    const statusEl = document.getElementById('sort-status');
    const winEl = document.getElementById('sort-win');
    let selected = null;             // index of the shelf a book is lifted from
    let solved = false;

    function render(){
      wrap.innerHTML = '';
      shelves.forEach((stack, si) => {
        const shelf = document.createElement('div');
        shelf.className = 'shelf' + (selected === si ? ' selected' : '');
        shelf.dataset.si = si;
        const base = document.createElement('div'); base.className = 'base';
        shelf.appendChild(base);
        stack.forEach((color, bi) => {
          const b = document.createElement('div');
          b.className = 'sbook';
          b.style.backgroundColor = color.c;   // cover = light hue
          b.style.borderColor = color.d;       // outline = darker same hue
          b.style.color = color.d;             // binding band uses currentColor
          // lift the top book of the selected shelf
          if(selected === si && bi === stack.length - 1) b.classList.add('lift');
          shelf.appendChild(b);
        });
        shelf.addEventListener('click', () => onShelfClick(si));
        wrap.appendChild(shelf);
      });
    }

    function bounce(si){
      const el = wrap.querySelector('.shelf[data-si="' + si + '"]');
      if(!el) return;
      el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
    }

    function onShelfClick(si){
      if(solved) return;
      const stack = shelves[si];
      if(selected === null){
        // pick up: only from a non-empty shelf
        if(stack.length === 0){ bounce(si); return; }
        selected = si;
        statusEl.textContent = 'now tap a shelf to place it';
        render();
        return;
      }
      if(si === selected){
        // tap same shelf = put it back down
        selected = null;
        statusEl.textContent = 'tap a shelf, then tap where the book goes';
        render();
        return;
      }
      // attempt move: top of `selected` -> `si`
      const from = shelves[selected];
      const moving = from[from.length - 1];
      const canPlace = stack.length < SLOTS && (stack.length === 0 || stack[stack.length - 1] === moving);
      if(!canPlace){ bounce(si); return; }

      from.pop();
      stack.push(moving);
      const landedShelf = si;
      selected = null;
      render();

      // little settle animation on the freshly landed book
      const shelfEl = wrap.querySelector('.shelf[data-si="' + landedShelf + '"]');
      const books = shelfEl ? shelfEl.querySelectorAll('.sbook') : [];
      if(books.length){ books[books.length - 1].classList.add('settle'); }

      if(isSolved(shelves)){
        solved = true;
        statusEl.textContent = 'all sorted';
        winEl.classList.add('show');
        // mark the bookstore pin as visited
        const pin = document.getElementById('m-bookstore');
        if(pin) pin.classList.add('visited');
      } else {
        statusEl.textContent = 'tap a shelf, then tap where the book goes';
      }
    }

    render();
  }

  /* ---------- puerto rico: sliding-tile puzzle of the home-screen art ---------- */
  function openPuertoRicoGame(){
    const N = 3;                       // 3x3 = 8 tiles + 1 blank
    const BOARD = 288;                 // px inside the frame
    const cell = BOARD / N;
    document.getElementById('scene-body').innerHTML = `
      <h2>puerto rico</h2>
      <div class="tagline">slide the pieces back together</div>
      <div class="puzzle" id="pr-puzzle" style="width:${BOARD}px;height:${BOARD}px;--puz-img:url('${HOMESCREEN}');"></div>
      <div class="reveal" id="pr-reveal">tap a piece next to the gap to slide it</div>
      <div class="placeholder-note">Prototype note: this is the home-screen art scrambled — swap in a favorite Puerto Rico photo. Solve it to see the whole picture.</div>
    `;
    document.getElementById('scene').classList.add('open');

    const board = document.getElementById('pr-puzzle');
    const reveal = document.getElementById('pr-reveal');
    const total = N * N;
    let order = Array.from({length: total}, (_, i) => i);   // order[position] = tileIndex; blank = total-1
    let solved = false;

    function xy(i){ return { c: i % N, r: Math.floor(i / N) }; }
    function render(){
      board.innerHTML = '';
      order.forEach((tile, pos) => {
        const p = xy(pos);
        const el = document.createElement('div');
        el.className = 'ptile' + (tile === total - 1 ? ' blank' : '');
        el.style.width = cell + 'px'; el.style.height = cell + 'px';
        el.style.left = (p.c * cell) + 'px'; el.style.top = (p.r * cell) + 'px';
        if(tile !== total - 1){
          const t = xy(tile);
          el.style.backgroundSize = BOARD + 'px ' + BOARD + 'px';
          el.style.backgroundPosition = (-t.c * cell) + 'px ' + (-t.r * cell) + 'px';
          el.addEventListener('click', () => tryMove(pos));
        }
        board.appendChild(el);
      });
    }
    function blankPos(){ return order.indexOf(total - 1); }
    function adjacent(a, b){
      const A = xy(a), B = xy(b);
      return (A.c === B.c && Math.abs(A.r - B.r) === 1) || (A.r === B.r && Math.abs(A.c - B.c) === 1);
    }
    function tryMove(pos){
      if(solved) return;
      const bp = blankPos();
      if(!adjacent(pos, bp)) return;
      [order[pos], order[bp]] = [order[bp], order[pos]];
      render(); checkWin();
    }
    function checkWin(){
      if(order.every((t, i) => t === i)){
        solved = true;
        reveal.innerHTML = 'there it is &#129293; — the whole picture, just like that trip.';
      }
    }
    function shuffle(){
      let steps = 120;
      while(steps-- > 0){
        const bp = blankPos();
        const neighbors = [];
        for(let i=0;i<total;i++){ if(adjacent(i, bp)) neighbors.push(i); }
        const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
        [order[pick], order[bp]] = [order[bp], order[pick]];
      }
      if(order.every((t,i) => t === i)) shuffle();   // reshuffle if it landed solved
    }
    shuffle();
    render();
  }
